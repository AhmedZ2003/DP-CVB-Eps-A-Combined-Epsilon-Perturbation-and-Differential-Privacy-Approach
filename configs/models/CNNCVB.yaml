model:
  name: VBCNN
  channels: [16, 32, 64]
  kernels: [5, 5, 5]
  stride: 2
  padding: valid
  widths: []
  pooling_positions: []
  pooling_layer: null
  conv_regularization_layer: null
  conv_activation_function:
    name: nn.ReLU
    parameters: []
  mlp_regularization_layer: null
  mlp_activation_function: null

  VB:
    _class: FullyConvolutionalVariationalBottleneck
    K: adaptive
    beta: 0.1
    positions: [0]
    bias: False
    kernel_size: 5

  # CDIA paper defense: combine CVB with low-level DP on gradients.
  privacy_defense:
    enabled: true
    mode: per_batch   # switch to per_sample when using Opacus/grad_sample hooks
    clip_norm: 20.0
    noise_multiplier: 0.001
    secure_mode: false
    only_when_training: true

training:
  loss: VBLoss
  lr_scheduler:
    metric: VBLoss
  early_stopping:
    metric: VBLoss
  glob:
    early_stopping:
      metric: VBLoss

attack:
  ignore_gradient_layers: []
  regularization: 0.01
